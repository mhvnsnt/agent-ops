name: docs
on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mkdocs mkdocs-material
      # docs/ holds symlinks to ../*.md (mkdocs needs docs_dir as a child dir).
      # Re-link here so newly added root .md files are picked up even if the
      # committer forgot to add the symlink.
      - run: mkdir -p docs && cd docs && for f in ../*.md; do ln -sf "$f" .; done
      - run: mkdocs gh-deploy --force
