[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchdog-v2"
version = "1.0.0"
description = "Read-only lane-registry watchdog built on the industry-standard Python monitoring stack (filelock, pydantic, psutil, httpx, tenacity, structlog, pybreaker, SQLite WAL). Replaces the prompt-only homebrew watchdog that looped on a dead target for 8 days (2026-11-02 to 2026-11-07)."
requires-python = ">=3.11"
dependencies = [
  "filelock>=3.13",
  "pydantic>=2.5",
  "psutil>=5.9",
  "httpx>=0.27",
  "tenacity>=8.2",
  "structlog>=24.1",
  "pybreaker>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
watchdog-v2 = "watchdog_v2.cli:main"

[tool.setuptools.packages.find]
include = ["watchdog_v2*"]
